name: demo-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt
      - run: python -m pytest app/tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}

  deploy-dev:
    name: Deploy DEV
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: demo-dev
    steps:
      - name: Demo approval complete
        run: echo "Approval received. This demo does not deploy resources."