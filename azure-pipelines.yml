trigger:
  branches:
    include:
      - main

stages:
  - stage: Test
    displayName: Test
    jobs:
      - job: tests
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: |
              python -m pip install -r app/requirements.txt
              python -m pytest app/tests -q
            displayName: Install dependencies and run tests
            env:
              PYTHONPATH: $(Build.SourcesDirectory)

  - stage: DEV
    displayName: DEV
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: approval
        displayName: Wait for demo approval
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ""
              instructions: "Approve to finish the no-op demo deployment. No resources will be changed."
              onTimeout: reject